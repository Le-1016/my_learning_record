<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAREER｜LEON INABA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260903-0615">
  <link rel="stylesheet" href="japanese-theme.css?v=20260903-0615">
  <style>
    .career-page { min-height: 100vh; padding: 150px 7vw 120px; position: relative; z-index: 2; }
    .career-title { margin: 0 0 16px; color: var(--red); font-family: "Orbitron", sans-serif; font-size: clamp(48px, 7vw, 96px); font-weight: 800; letter-spacing: 0.08em; }
    .career-lead { max-width: 760px; margin: 0 0 90px; color: var(--white); line-height: 2; opacity: 0.8; }

    .timeline {
      --date-col: 110px;
      --node-col: 80px;
      position: relative;
      max-width: 1040px;
      margin: 0 auto;
      padding: 12px 0 24px;
    }

    .timeline-item {
      position: relative;
      display: grid;
      grid-template-columns: var(--date-col) var(--node-col) 1fr;
      align-items: start;
      min-height: 165px;
      padding: 12px 0 36px;
    }

    /* 線を各行のノード中心から描画することで、丸と必ず同軸にする */
    .timeline-item::before {
      content: "";
      position: absolute;
      z-index: 0;
      left: calc(var(--date-col) + (var(--node-col) / 2));
      top: -28px;
      bottom: -28px;
      width: 5px;
      background: linear-gradient(to bottom, var(--red-bright), var(--red));
      box-shadow: 0 0 14px rgba(229,34,34,0.16);
      transform: translateX(-50%) scaleY(0);
      transform-origin: top;
      opacity: 0;
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    }

    .timeline-item:first-child::before { top: 0; }
    .timeline-item:last-child::before { bottom: 0; }

    .timeline-phase,
    .timeline-copy {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.68s ease, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .timeline-phase {
      padding-top: 12px;
      color: var(--red);
      font-family: "Orbitron", sans-serif;
      font-size: clamp(16px, 1.7vw, 22px);
      font-weight: 700;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .timeline-node {
      position: relative;
      z-index: 2;
      justify-self: center;
      width: 34px;
      height: 34px;
      margin-top: 4px;
      border: 0;
      border-radius: 50%;
      background: var(--red);
      box-sizing: border-box;
      box-shadow: 0 0 14px rgba(229,34,34,0.18);
      opacity: 0;
      transform: scale(0.35);
      transition: opacity 0.32s ease, transform 0.68s cubic-bezier(0.18, 1.35, 0.36, 1), box-shadow 0.68s ease;
    }

    .timeline-copy { padding: 1px 0 0 18px; max-width: 760px; transition-delay: 0.08s; }
    .timeline-copy h2 { margin: 0; color: var(--red); font-family: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: clamp(23px, 2.5vw, 34px); font-weight: 600; letter-spacing: 0.02em; line-height: 1.7; }

    /* 画面内へ入った瞬間に、線→丸→文字の順で重みをつけて出す */
    .timeline-item.is-visible::before {
      transform: translateX(-50%) scaleY(1);
      opacity: 1;
    }

    .timeline-item.is-visible .timeline-node {
      opacity: 1;
      transform: scale(1);
      box-shadow: 0 0 18px rgba(229,34,34,0.24);
    }

    .timeline-item.is-visible .timeline-phase,
    .timeline-item.is-visible .timeline-copy {
      opacity: 1;
      transform: translateY(0);
    }

    nav a.active { color: var(--red-bright); text-shadow: 0 0 10px rgba(229,34,34,0.45); }

    @media (max-width: 760px) {
      .career-page { padding: 130px 7vw 90px; }
      .career-lead { margin-bottom: 58px; }
      .timeline { --date-col: 0px; --node-col: 54px; }
      .timeline-item { grid-template-columns: var(--node-col) 1fr; min-height: 0; padding: 0 0 54px; }
      .timeline-item::before { left: calc(var(--node-col) / 2); width: 4px; top: -26px; bottom: -26px; }
      .timeline-item:first-child::before { top: 0; }
      .timeline-item:last-child::before { bottom: 0; }
      .timeline-phase { grid-column: 2; padding: 0 0 8px 18px; font-size: 14px; }
      .timeline-node { grid-column: 1; grid-row: 1 / span 2; width: 30px; height: 30px; margin-top: 0; }
      .timeline-copy { grid-column: 2; padding: 0 0 0 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .timeline-item::before,
      .timeline-phase,
      .timeline-node,
      .timeline-copy {
        transition: none;
        opacity: 1;
        transform: none;
      }
      .timeline-item::before { transform: translateX(-50%) scaleY(1); }
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"><div class="grid"></div><div class="glow glow-1"></div><div class="glow glow-2"></div></div>
  <header>
    <a href="index.html" class="logo">LEON INABA<span>.</span></a>
    <nav>
      <a href="skill.html">SKILL</a>
      <a href="index.html#activity">ACTIVITY</a>
      <a href="certification.html">CERTIFICATION</a>
      <a href="index.html#research">RESEARCH</a>
      <a href="career.html" class="active">CAREER</a>
    </nav>
  </header>
  <main class="career-page">
    <h1 class="career-title">CAREER</h1>
    <p class="career-lead">これまでの進学・在籍の記録を時系列でまとめています。</p>
    <div class="timeline">
      <section class="timeline-item"><div class="timeline-phase">2025.03</div><div class="timeline-node" aria-hidden="true"></div><div class="timeline-copy"><h2>大阪市立文の里中学校　卒業</h2></div></section>
      <section class="timeline-item"><div class="timeline-phase">2025.04</div><div class="timeline-node" aria-hidden="true"></div><div class="timeline-copy"><h2>大阪公立大学高専 総合工学システム学科　入学</h2></div></section>
      <section class="timeline-item"><div class="timeline-phase">2026.03</div><div class="timeline-node" aria-hidden="true"></div><div class="timeline-copy"><h2>１年次　修了</h2></div></section>
      <section class="timeline-item"><div class="timeline-phase">2026.04</div><div class="timeline-node" aria-hidden="true"></div><div class="timeline-copy"><h2>２年 知能情報コース　配属</h2></div></section>
    </div>
  </main>

  <script>
    (() => {
      const items = [...document.querySelectorAll('.timeline-item')];
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (reduceMotion || !('IntersectionObserver' in window)) {
        items.forEach((item) => item.classList.add('is-visible'));
        return;
      }

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        });
      }, {
        threshold: 0.34,
        rootMargin: '0px 0px -8% 0px'
      });

      items.forEach((item) => observer.observe(item));
    })();
  </script>
</body>
</html>
