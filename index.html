<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 背景 -->
  <div class="background">
    <div class="grid"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>


  <!-- Navigation -->
  <header>
    <a href="#" class="logo">
      TOUMA<span>.</span>
    </a>

    <nav>
      <a href="#about">About</a>
      <a href="#works">Works</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>


  <!-- Hero -->
  <main>

    <section class="hero">

      <div class="hero-content">

        <h1>
          CREATE<br>
          <span>BEYOND</span><br>
          THE LIMIT.
        </h1>

        <p>
          Artificial Intelligence / Software Development
        </p>

        <a href="#works" class="hero-button">
          Explore
          <span>→</span>
        </a>

      </div>

      <div class="hero-decoration">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
      </div>

      <div class="scroll-line"></div>

    </section>


    <!-- Works -->
    <section id="works" class="works">

      <div class="section-heading">
        <h2>Works<span>.</span></h2>
      </div>

      <div class="works-grid">

        <article class="work-card">
          <div class="work-image"></div>

          <div class="work-content">
            <h3>Project</h3>
            <p>Python / AI / Machine Learning</p>
          </div>
        </article>


        <article class="work-card">
          <div class="work-image"></div>

          <div class="work-content">
            <h3>Project</h3>
            <p>Web / Software Development</p>
          </div>
        </article>


        <article class="work-card">
          <div class="work-image"></div>

          <div class="work-content">
            <h3>Project</h3>
            <p>Research / Technology</p>
          </div>
        </article>

      </div>

    </section>


    <!-- About -->
    <section id="about" class="about">

      <div class="section-heading">
        <h2>About<span>.</span></h2>
      </div>

      <div class="about-box"></div>

    </section>

  </main>


  <footer>
    <div class="footer-line"></div>
  </footer>

</body>
</html>
